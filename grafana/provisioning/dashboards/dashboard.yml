# Tells Grafana to load any dashboard JSON found in /var/lib/grafana/dashboards
# (mounted from ./grafana/dashboards in docker-compose.yml) on startup, so the
# devmentor-api dashboard is already there the first time anyone opens Grafana.
apiVersion: 1

providers:
  - name: devmentor-api
    orgId: 1
    folder: ""
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
