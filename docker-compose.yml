# Local dev dependencies for devmentor-api.
# The API itself runs on the host via `pnpm dev` during development; only the
# stateful backing services live in Docker here. (A full containerized stack —
# api + worker + pgbouncer — arrives in Phase 14.)
#
#   docker compose up -d        # start postgres + redis + kafka + jaeger + prometheus + grafana
#   docker compose ps           # all should be "healthy"
#   docker compose down         # stop (add -v to wipe data volumes)
#
#   Jaeger UI:      http://localhost:16686
#   Prometheus UI:  http://localhost:9090  (alert firing state: /alerts)
#   Grafana UI:     http://localhost:3001  (anonymous viewer access, dev only)

services:
  postgres:
    image: postgres:16-alpine
    container_name: devmentor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devmentor
      POSTGRES_PASSWORD: devmentor
      POSTGRES_DB: devmentor
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devmentor -d devmentor"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: devmentor-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Single-broker, KRaft-mode Kafka (no Zookeeper) — a dev-only stand-in for a
  # real cluster (which would run 3+ brokers for replication). Introduced in
  # Phase 10 specifically for the properties BullMQ doesn't give us: multiple
  # INDEPENDENT consumer groups each reading every event, and a durable,
  # replayable log (see ADR-0011's graduation criteria from ADR-0007).
  kafka:
    image: apache/kafka:3.7.0
    container_name: devmentor-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: "ZGV2bWVudG9yLWRldi1jbHVzdGVy" # fixed, made-up base64 id — fine for a single dev node
    ports:
      - "9092:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 15

  # Jaeger, all-in-one — a trace STORAGE + QUERY UI, receiving spans over
  # OTLP (native since Jaeger 1.35+, no separate collector needed for local
  # dev). In-memory storage: traces vanish on restart, which is fine for a
  # dev box, not for production (that would want Elasticsearch/Cassandra/
  # object-storage-backed storage behind the same Jaeger query API).
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: devmentor-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686" # UI
      - "4318:4318"   # OTLP HTTP receiver — matches OTEL_EXPORTER_OTLP_ENDPOINT

  # Prometheus (Task 12.2) — scrapes the API's `/metrics` on the HOST (the API
  # runs via `pnpm dev`, not in this Compose network) via `host.docker.internal`.
  # `extra_hosts` makes that name resolve on Linux too, not just Docker Desktop.
  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: devmentor-prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - promdata:/prometheus
    ports:
      - "9090:9090" # Prometheus UI — http://localhost:9090; alert firing state at /alerts

  # Grafana (Task 12.3) — datasource and the devmentor-api dashboard are both
  # auto-provisioned from files in ./grafana, so a fresh `docker compose up -d`
  # gives a working dashboard with no manual setup (same philosophy as the
  # Prisma seed script, Task 1.4: reproducible state from a checked-in file).
  grafana:
    image: grafana/grafana:11.2.0
    container_name: devmentor-grafana
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true" # dev only — no login wall to view the dashboard
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "3001:3000" # Grafana UI — http://localhost:3001 (3000 is often already taken by a frontend dev server)
    depends_on:
      - prometheus

volumes:
  pgdata:
  redisdata:
  kafkadata:
  promdata:
  grafanadata:
